services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reservation_system
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8"
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservation_system"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/reservation_system
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/scripts/migrate-and-seed.js"]
    restart: "no"

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/reservation_system
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-development}
      JWT_ISSUER: reservation-system
      JWT_AUDIENCE: reservation-system-client
      JWT_EXPIRES_IN_SECONDS: 3600
      PG_POOL_MAX: 10
      PG_CONNECTION_TIMEOUT_MS: 1000
      PG_STATEMENT_TIMEOUT_MS: 3000
      PG_IDLE_IN_TX_TIMEOUT_MS: 4000
      PG_TRANSACTION_TIMEOUT_MS: 5000
      PG_IDEMPOTENCY_LOCK_TIMEOUT_MS: 300
      PG_SEAT_LOCK_TIMEOUT_MS: 500
      RESERVATION_MAX_SEATS: 8
      RESERVATION_TX_RETRY_ATTEMPTS: 2
      RESERVATION_TX_RETRY_BASE_DELAY_MS: 25
      RESERVATION_TX_RETRY_MAX_DELAY_MS: 100
      RESERVATION_ADMISSION_MAX_IN_FLIGHT: 8
      RESERVATION_ADMISSION_MAX_QUEUE: 16
      RESERVATION_ADMISSION_QUEUE_TIMEOUT_MS: 250
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/readyz'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2d"
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana-data:
